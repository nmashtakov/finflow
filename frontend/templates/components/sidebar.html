<div id="layoutSidenav_nav">
    <nav class="sidenav shadow-right sidenav-light">
        <div class="sidenav-menu">
            {% if user.is_authenticated %}
            <div class="px-3 pt-3 pb-3 border-bottom">
                <div class="text-xs text-uppercase text-muted fw-700 mb-2">Модули</div>
                <div class="btn-group w-100" role="group" aria-label="Переключение между модулями">
                    <a
                        class="btn btn-sm {% if request.resolver_match.namespace == 'crm' %}btn-outline-primary{% else %}btn-primary{% endif %}"
                        href="{% url 'dashboard' %}"
                    >
                        Финансы
                    </a>
                    <a
                        class="btn btn-sm {% if request.resolver_match.namespace == 'crm' %}btn-primary{% else %}btn-outline-primary{% endif %}"
                        href="{% url 'crm:dashboard' %}"
                    >
                        CRM
                    </a>
                </div>
            </div>
            {% endif %}

            {% if request.resolver_match.namespace == 'crm' %}
                {% include "components/sidebar_crm.html" %}
            {% else %}
                {% include "components/sidebar_finance.html" %}
            {% endif %}
        </div>
    </nav>
</div>
